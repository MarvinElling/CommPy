name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest code snippet that triggers the bug.
      render: python
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Traceback / actual output
      render: shell
  - type: input
    id: version
    attributes:
      label: CommPy version
      placeholder: "e.g. 1.0.0 (import commpy; commpy.__version__)"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, and relevant package versions (numpy/scipy/numba).
      placeholder: "e.g. Python 3.11, Ubuntu 24.04, numpy 2.0"
    validations:
      required: true
