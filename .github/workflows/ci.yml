name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.10', '3.11', '3.12' ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package (dev extras, no numba)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint with ruff
        run: ruff check src tests
      - name: Type-check with mypy
        run: mypy
      - name: Test with pytest (numba-absent fallback path)
        run: pytest

  test-fast-extra:
    # Same suite with the optional `fast` (numba) extra installed, to exercise
    # the JIT-accelerated code paths as well as the fallback ones above.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package (dev + fast extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,fast]"
      - name: Test with pytest (numba-accelerated path)
        run: pytest
