[build-system]
requires = ["setuptools>=68", "setuptools-scm[toml]"]
build-backend = "setuptools.build_meta"


[project]
name = "commpy"
authors = [
    {name = "Marvin Elling", email = "mane.der@web.de"},
]
version = "1.1.0"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Communications",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
description = "Python Library for Communication Engineering."
dependencies = [
  "numpy",
  "matplotlib",
  "scipy",
]
keywords = [
    "Communication",
    "Information",
    "Information Theory",
    "Signal Processing",
    "Engineering",
    "Channel Coding",
    "Modulation",
    "OFDM",
    "Error Correction",
    "DSP",
    "Shannon",
    "Entropy",
]
license = {text = "Apache 2.0"}
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/MarvinElling/CommPy"
Repository = "https://github.com/MarvinElling/CommPy"
Issues = "https://github.com/MarvinElling/CommPy/issues"
Changelog = "https://github.com/MarvinElling/CommPy/blob/main/docs/CHANGELOG.md"
Documentation = "https://marvinelling.github.io/CommPy/"

[project.scripts]
# MCP server exposing CommPy to AI agents (requires the `mcp` extra).
commpy-mcp = "commpy.mcp_server:main"

[project.optional-dependencies]
# Optional JIT acceleration (see commpy._utils.numba_compat). Kept separate
# from `dev` so the numba-absent fallback path is what contributors get by
# default, and CI can exercise both configurations explicitly.
fast = [
    "numba",
]
# Optional AI-for-wireless layer (see commpy.ml). Kept separate so the base
# install stays NumPy/SciPy-only and `import commpy` never pulls in PyTorch.
ml = [
    "torch",
]
# Optional MCP server (see commpy.mcp_server); exposes the `commpy-mcp` command.
mcp = [
    "mcp>=1.0",
]
dev = [
    "isort",
    "mypy",
    "pytest",
    "pytest-benchmark",
    "pytest-cov",
    "ruff",
    "yapf",
]

[tool.setuptools.package-data]
commpy = ["py.typed"]

[tool.coverage]
report.exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == '__main__':",
]
report.show_missing = true
report.skip_covered = true
run.branch = true
run.source = ["src"]

[tool.isort]
combine_as_imports = true
ensure_newline_before_comments = true
include_trailing_comma = true
line_length = 100
multi_line_output = 3
split_on_trailing_comma = true


[tool.mypy]
# NOTE: disallow_any_explicit is intentionally left at its default (off).
# numpy's own stubs represent an unparameterized `np.ndarray` as
# `ndarray[Any, Any]`, and `numpy.typing.ArrayLike` is an Any-containing
# union by design (it exists precisely to accept "array-like" input: lists,
# tuples, scalars, or ndarrays). Both are used pervasively and idiomatically
# throughout this numpy-based library, so disallow_any_explicit would flag
# almost every public function signature without adding real safety.
explicit_package_bases = true
fast_module_lookup = true
files = ["src", "tests", "examples"]
mypy_path = "src"
namespace_packages = true
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
# Test suite: fixtures/parametrize inputs are dynamically typed and test names
# already document intent, so strict annotation requirements add no value here.
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# scipy does not ship inline type stubs (a separate scipy-stubs package would
# be needed); used extensively throughout this library (FFT, filter design,
# special functions), so untyped imports from it are expected, not an error.
module = ["scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# torch is an optional extra (commpy[ml]); when it isn't installed, treat its
# imports as resolvable so the base mypy run over commpy.ml still passes.
module = ["torch.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# mcp is an optional extra (commpy[mcp]); imported lazily in commpy.mcp_server,
# so resolve it as missing-ok when the extra isn't installed.
module = ["mcp.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# PyTorch's nn.Module.__call__ and many tensor ops are annotated as returning
# Any, so `warn_return_any` fights the framework throughout the (torch-only)
# commpy.ml layer. Everything else stays strict.
module = ["commpy._ml.*", "commpy.ml"]
warn_return_any = false


[tool.pydocstyle]
convention = "google"
add_select = ["D204", "D400", "D401", "D404", "D413"]


[tool.pytest.ini_options]
addopts = ["--cov", "--verbose"]
# Bare `pytest` runs the correctness suite only; the performance benchmarks in
# benchmarks/ are opt-in (`pytest benchmarks/ --benchmark-only --no-cov`).
testpaths = ["tests"]


[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
  "ALL",
]
ignore = [
  "PLR2004",
  "T201",
  # allow asserts
  "S101",
  "INP001",
  # Signal-processing/coding-theory notation (I, Q, T, N, K, G, H, n, k, ...)
  # mirrors textbook/standard formulas throughout this domain; enforcing
  # snake_case here would actively hurt readability and cross-referencing.
  "N803",
  "N806",
  # matplotlib's own API is positional-boolean-heavy (plt.grid(True), ...)
  # and this library does substantial plotting.
  "FBT003",
]

[tool.ruff.lint.per-file-ignores]
# Test function names document intent on their own; requiring a docstring and
# full annotations (incl. on pytest fixture parameters) on every test is pure
# ceremony. Standard practice in numpy/scipy/pandas-style test suites.
"tests/**" = ["ANN001", "ANN201", "ANN202", "D100", "D101", "D102", "D103", "D104"]
# Benchmarks are dev tooling in the same spirit as the tests: intent-documenting
# names, pytest-benchmark fixtures, no public API to annotate.
"benchmarks/**" = ["ANN001", "ANN201", "ANN202", "D103"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true
known-first-party = ["commpy"]

[tool.ruff.lint.flake8-quotes]
avoid-escape = false
inline-quotes = "single"

[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.setuptools_scm]


[tool.yapf]
based_on_style = "google"
column_limit = 100
allow_split_before_dict_value = false
dedent_closing_brackets = true
indent_dictionary_value = false